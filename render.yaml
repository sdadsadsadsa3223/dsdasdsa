services:
  - type: web
    name: alai-cloud-telegram
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: MANAGER_CHAT_ID
        sync: false
      - key: MANAGER_CONTACT_URL
        value: https://t.me/alairustam
      - key: DATA_DIR
        value: data
      - key: WELCOME_STICKER_ID
        sync: false
